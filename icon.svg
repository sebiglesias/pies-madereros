<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="woodFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="woodTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="woodSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="rulerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="500" height="500" rx="104" fill="none" stroke="#d97706" stroke-opacity="0.3" stroke-width="4"/>

  <!-- 3D Stack of Timber Beams -->
  <g filter="drop-shadow(0 16px 24px rgba(0,0,0,0.6))">
    <!-- Bottom Beam -->
    <g transform="translate(60, 220)">
      <!-- Top Face -->
      <path d="M 0 60 L 80 0 L 360 0 L 280 60 Z" fill="url(#woodTop)"/>
      <!-- Front End-Grain Face with Rings -->
      <path d="M 0 60 L 280 60 L 280 150 L 0 150 Z" fill="url(#woodFront)"/>
      <!-- Right Side Face -->
      <path d="M 280 60 L 360 0 L 360 90 L 280 150 Z" fill="url(#woodSide)"/>
      
      <!-- Grain lines on top face -->
      <line x1="60" y1="45" x2="330" y2="15" stroke="#b45309" stroke-width="3" opacity="0.6"/>
      <line x1="120" y1="45" x2="345" y2="28" stroke="#b45309" stroke-width="2.5" opacity="0.6"/>
      <line x1="180" y1="45" x2="355" y2="40" stroke="#b45309" stroke-width="2" opacity="0.6"/>

      <!-- End-grain growth rings on front face -->
      <path d="M 30 150 C 40 100 80 90 120 150" stroke="#78350f" stroke-width="2.5" fill="none" opacity="0.4"/>
      <path d="M 20 150 C 35 80 95 70 145 150" stroke="#78350f" stroke-width="2.5" fill="none" opacity="0.4"/>
      <path d="M 10 150 C 30 60 110 50 170 150" stroke="#78350f" stroke-width="2.5" fill="none" opacity="0.4"/>
    </g>

    <!-- Top Beam (Stacked slightly offset) -->
    <g transform="translate(100, 110)">
      <!-- Top Face -->
      <path d="M 0 50 L 70 0 L 300 0 L 230 50 Z" fill="url(#woodTop)"/>
      <!-- Front Face -->
      <path d="M 0 50 L 230 50 L 230 125 L 0 125 Z" fill="url(#woodFront)"/>
      <!-- Right Side Face -->
      <path d="M 230 50 L 300 0 L 300 75 L 230 125 Z" fill="url(#woodSide)"/>

      <!-- Grain lines -->
      <line x1="45" y1="38" x2="270" y2="12" stroke="#b45309" stroke-width="2.5" opacity="0.6"/>
      <line x1="95" y1="38" x2="285" y2="24" stroke="#b45309" stroke-width="2" opacity="0.6"/>
    </g>
  </g>

  <!-- Measuring Tape / Ruler Overlay -->
  <g transform="translate(80, 360) rotate(-10)">
    <rect x="0" y="0" width="360" height="46" rx="6" fill="url(#rulerGrad)" stroke="#ca8a04" stroke-width="3" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.5))"/>
    
    <!-- Ruler Inch Ticks -->
    <!-- Major ticks -->
    <line x1="30" y1="0" x2="30" y2="24" stroke="#1c1917" stroke-width="3"/>
    <text x="30" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="900" fill="#1c1917" text-anchor="middle">1"</text>
    
    <line x1="90" y1="0" x2="90" y2="24" stroke="#1c1917" stroke-width="3"/>
    <text x="90" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="900" fill="#1c1917" text-anchor="middle">2"</text>
    
    <line x1="150" y1="0" x2="150" y2="24" stroke="#1c1917" stroke-width="3"/>
    <text x="150" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="900" fill="#1c1917" text-anchor="middle">3"</text>
    
    <line x1="210" y1="0" x2="210" y2="24" stroke="#1c1917" stroke-width="3"/>
    <text x="210" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="900" fill="#1c1917" text-anchor="middle">4"</text>
    
    <line x1="270" y1="0" x2="270" y2="24" stroke="#1c1917" stroke-width="3"/>
    <text x="270" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="900" fill="#1c1917" text-anchor="middle">5"</text>

    <line x1="330" y1="0" x2="330" y2="24" stroke="#1c1917" stroke-width="3"/>
    <text x="330" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="900" fill="#1c1917" text-anchor="middle">6"</text>

    <!-- Minor ticks -->
    <line x1="60" y1="0" x2="60" y2="16" stroke="#1c1917" stroke-width="2"/>
    <line x1="120" y1="0" x2="120" y2="16" stroke="#1c1917" stroke-width="2"/>
    <line x1="180" y1="0" x2="180" y2="16" stroke="#1c1917" stroke-width="2"/>
    <line x1="240" y1="0" x2="240" y2="16" stroke="#1c1917" stroke-width="2"/>
    <line x1="300" y1="0" x2="300" y2="16" stroke="#1c1917" stroke-width="2"/>
  </g>

  <!-- PT (Pies Tablares) Badge in Top Right -->
  <g transform="translate(350, 60)">
    <rect x="0" y="0" width="100" height="42" rx="21" fill="#f59e0b" stroke="#78350f" stroke-width="2"/>
    <text x="50" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="900" fill="#1c1917" text-anchor="middle">P² / PT</text>
  </g>
</svg>
